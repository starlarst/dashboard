<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Ghost | Leaderboard</title>
    <link rel="stylesheet" href="/static/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700&family=Inter:wght@400;500;600;700" rel="stylesheet">
</head>
<body data-page="leaderboard">
    <div id="layout-slot"></div>
    <script src="/static/layout.js"></script>

    <main class="main-content" id="main-content">
        <header class="page-header">
            <div class="user-greeting">
                <div class="page-eyebrow"><span>Rankings</span></div>
                <h1>Leaderboard</h1>
                <p>The most experienced adventurers in the realm</p>
            </div>
        </header>

        <section class="panel leaderboard-panel">
            <div class="panel-header">
                <span><i class="fa-solid fa-trophy" style="color:var(--gold)"></i> Top Adventurers</span>
                <span class="lb-count" id="lb-count"></span>
            </div>

            <div id="lb-loading" class="lb-status">
                <i class="fa-solid fa-spinner fa-spin"></i>
                Loading rankings...
            </div>

            <div class="lb-podium" id="lb-podium"></div>

            <div style="overflow-x:auto;">
                <table class="lb-table" id="lb-table" style="display:none;">
                    <thead>
                        <tr><th>Rank</th><th>Player</th><th>Class</th><th>XP</th></tr>
                    </thead>
                    <tbody id="lb-tbody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const API_BASE = window.location.origin;

        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/[&<>"']/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[ch]));
        }

        function avatarFor(name) {
            return `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(name || '')}&backgroundColor=b6e3f4`;
        }

        function podiumHTML(player, rankClass, icon, colorClass) {
            return `
                <div class="podium-item ${rankClass}">
                    <img src="${avatarFor(player.name)}" class="podium-avatar" alt="">
                    <div class="podium-rank ${colorClass}">${icon}</div>
                    <div class="podium-name">${escapeHTML(player.name)}</div>
                    <div class="podium-score">${(player.xp || 0).toLocaleString()} XP</div>
                </div>`;
        }

        function renderLeaderboard(players, myId) {
            const podium = document.getElementById('lb-podium');
            const tbody  = document.getElementById('lb-tbody');
            const table  = document.getElementById('lb-table');

            podium.innerHTML = '';
            if (players[1]) podium.innerHTML += podiumHTML(players[1], 'second', '🥈', 'silver');
            if (players[0]) podium.innerHTML += podiumHTML(players[0], 'first', '👑', 'gold');
            if (players[2]) podium.innerHTML += podiumHTML(players[2], 'third', '🥉', 'bronze');

            if (players.length === 0) {
                tbody.innerHTML = '<tr class="lb-empty-row"><td colspan="4">No adventurers have earned XP yet.</td></tr>';
            } else {
                tbody.innerHTML = players.map((p, i) => {
                    const rankCls = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';
                    const meCls   = myId && String(p.id) === String(myId) ? 'lb-you' : '';
                    const title   = p.title ? ` <span style="color:var(--dash-text-faint);font-size:.78rem">${escapeHTML(p.title)}</span>` : '';
                    return `
                        <tr class="${meCls}">
                            <td><span class="lb-rank ${rankCls}">#${i + 1}</span></td>
                            <td>
                                <img src="${avatarFor(p.name)}" class="lb-avatar" alt="">
                                <span class="lb-name">${escapeHTML(p.name)}</span>${title}
                            </td>
                            <td><span class="lb-class">${escapeHTML(p.class)}</span></td>
                            <td><span class="lb-score">${(p.xp || 0).toLocaleString()} XP</span></td>
                        </tr>`;
                }).join('');
            }

            document.getElementById('lb-count').textContent = `${players.length} ranked`;
            document.getElementById('lb-loading').style.display = 'none';
            table.style.display = '';
        }

        function showLeaderboardError(message) {
            document.getElementById('lb-loading').innerHTML =
                `<i class="fa-solid fa-triangle-exclamation" style="color:var(--dash-red)"></i>${escapeHTML(message)}`;
        }

        async function loadLeaderboard() {
            try {
                const [lbRes, meRes] = await Promise.all([
                    fetch(`${API_BASE}/api/game/leaderboard`),
                    fetch(`${API_BASE}/api/me`).catch(() => null)
                ]);
                if (!lbRes.ok) throw new Error(`Server returned ${lbRes.status}`);
                const data = await lbRes.json();

                let myId = null;
                if (meRes && meRes.ok) {
                    const me = await meRes.json();
                    myId = (me.user || me).discord_id || null;
                }

                renderLeaderboard(data.leaderboard || [], myId);
            } catch (err) {
                console.error('Leaderboard error:', err);
                showLeaderboardError('Could not load the leaderboard. Please try again later.');
            }
        }

        document.addEventListener('DOMContentLoaded', loadLeaderboard);
    </script>
</body>
</html>
