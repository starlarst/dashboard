<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Ghost | Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700&family=Inter:wght@400;500;600;700" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/dashboard.css">
    <style>
        :root {
            --void-black:#0a0a0f;
            --dash-teal:#2dd9e8;
            --dash-teal-dim:rgba(45,217,232,0.13);
            --dash-purple:#a855f7;
            --dash-purple-dim:rgba(168,85,247,0.12);
            --bone-white:#f4f4f5;
            --dash-text-dim:#a1a1aa;
            --dash-text-faint:#71717a;
            --glass-bg:rgba(255,255,255,0.04);
            --glass-border:rgba(255,255,255,0.1);
            --gold:#fbbf24;
            --emerald:#34d399;
            --red:#f87171;
            --rarity-common:#9ca3af;
            --rarity-rare:#3b82f6;
            --rarity-epic:#a855f7;
            --rarity-legendary:#f59e0b;
            --ease:cubic-bezier(0.22,1,0.36,1);
            --radius-sm:10px;
            --radius-md:16px;
            --radius-lg:20px;
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:0.001ms!important; transition-duration:0.001ms!important; } }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Sora','Plus Jakarta Sans','Inter',sans-serif;
            background:var(--void-black); color:var(--bone-white);
            min-height:100vh; overflow-x:hidden;
        }
        body::before {
            content:''; position:fixed; inset:0;
            background:
                radial-gradient(ellipse at 15% 40%, rgba(45,217,232,0.04) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 60%, rgba(188,19,254,0.03) 0%, transparent 55%);
            pointer-events:none; z-index:0;
        }
        .page-hero { margin-bottom:2rem; padding-bottom:1.75rem; border-bottom:1px solid var(--glass-border); }
        .page-hero-eyebrow {
            font-size:0.72rem; font-weight:700; letter-spacing:2px; text-transform:uppercase;
            color:var(--dash-teal); margin-bottom:0.5rem; display:flex; align-items:center; gap:8px;
        }
        .page-hero-eyebrow::before { content:''; width:20px; height:1px; background:var(--dash-teal); opacity:0.6; }
        .page-hero h1 {
            font-size:2rem; font-weight:800; letter-spacing:-0.5px;
            background:linear-gradient(135deg,#fff 0%,var(--dash-teal) 100%);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
        }
        .page-hero-sub { font-size:0.9rem; color:var(--dash-text-dim); margin-top:0.4rem; }

        .card {
            background:var(--glass-bg); border:1px solid var(--glass-border);
            border-radius:var(--radius-lg); padding:1.5rem; position:relative;
        }
        .card-title {
            font-size:0.72rem; font-weight:700; letter-spacing:1.5px; text-transform:uppercase;
            color:var(--dash-text-faint); margin-bottom:1rem;
            display:flex; align-items:center; gap:8px;
        }
        .card-title i { color:var(--dash-teal); }

        .profile-top { display:flex; gap:1.5rem; align-items:center; flex-wrap:wrap; margin-bottom:1.25rem; }
        .avatar-wrap {
            width:104px; height:104px; border-radius:50%; padding:3px; flex-shrink:0;
            background:linear-gradient(135deg,var(--dash-teal),var(--dash-purple));
        }
        .avatar-wrap img {
            width:100%; height:100%; border-radius:50%; object-fit:cover;
            background:var(--void-black); display:block;
        }
        .avatar-fallback {
            width:100%; height:100%; border-radius:50%; background:var(--void-black);
            display:flex; align-items:center; justify-content:center;
            font-size:2.25rem; color:var(--dash-text-faint);
        }
        .identity { flex:1; min-width:200px; }
        .identity h2 { font-size:1.6rem; font-weight:800; letter-spacing:-0.3px; word-break:break-word; }
        .identity-tags { display:flex; gap:8px; flex-wrap:wrap; margin-top:0.6rem; }
        .tag {
            font-size:0.7rem; font-weight:700; letter-spacing:0.5px; padding:4px 12px;
            border-radius:20px; border:1px solid var(--glass-border); color:var(--dash-text-dim);
            display:inline-flex; align-items:center; gap:6px;
        }
        .tag.level { background:var(--dash-teal-dim); border-color:rgba(45,217,232,0.3); color:var(--dash-teal); }
        .tag.class { background:var(--dash-purple-dim); border-color:rgba(168,85,247,0.3); color:var(--dash-purple); }
        .tag.gold  { color:var(--gold); border-color:rgba(251,191,36,0.3); background:rgba(251,191,36,0.08); }

        .xp-block { margin-top:0.25rem; }
        .xp-label { display:flex; justify-content:space-between; font-size:0.74rem; color:var(--dash-text-dim); margin-bottom:6px; font-weight:600; }
        .xp-bar { height:8px; border-radius:6px; background:rgba(255,255,255,0.06); overflow:hidden; }
        .xp-fill {
            height:100%; width:0; border-radius:6px;
            background:linear-gradient(90deg,var(--dash-teal),var(--dash-purple));
            transition:width 900ms var(--ease);
        }

        .grid-2 { display:grid; grid-template-columns:1.4fr 1fr; gap:1.25rem; margin-bottom:1.25rem; }
        @media (max-width:900px) { .grid-2 { grid-template-columns:1fr; } }

        .stat-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:0.75rem; }
        .stat {
            background:rgba(8,9,13,0.6); border:1px solid var(--glass-border);
            border-radius:var(--radius-md); padding:0.9rem 1rem;
        }
        .stat-label { font-size:0.66rem; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--dash-text-faint); display:flex; align-items:center; gap:6px; }
        .stat-value { font-size:1.35rem; font-weight:800; margin-top:0.35rem; }
        .stat-value.gold { color:var(--gold); }

        .rarity-row { display:flex; align-items:center; gap:10px; margin-bottom:0.7rem; font-size:0.78rem; }
        .rarity-row:last-child { margin-bottom:0; }
        .rarity-name { width:80px; font-weight:700; text-transform:capitalize; }
        .rarity-track { flex:1; height:6px; border-radius:4px; background:rgba(255,255,255,0.06); overflow:hidden; }
        .rarity-fill { height:100%; border-radius:4px; width:0; transition:width 800ms var(--ease); }
        .rarity-count { width:32px; text-align:right; color:var(--dash-text-dim); font-weight:700; }

        .equip-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:0.75rem; }
        .equip-item {
            display:flex; align-items:center; gap:10px; padding:0.75rem 0.9rem;
            background:rgba(8,9,13,0.7); border:1px solid var(--glass-border);
            border-radius:var(--radius-md);
        }
        .equip-item.rare { border-color:rgba(59,130,246,0.4); }
        .equip-item.epic { border-color:rgba(168,85,247,0.5); }
        .equip-item.legendary { border-color:rgba(245,158,11,0.55); box-shadow:0 0 16px rgba(245,158,11,0.12); }
        .equip-item i { font-size:1.2rem; }
        .equip-name { font-size:0.76rem; font-weight:600; line-height:1.3; word-break:break-word; }
        .equip-rarity { font-size:0.62rem; letter-spacing:0.8px; text-transform:uppercase; font-weight:700; margin-top:2px; }

        .cta-row { margin-top:1rem; }
        .btn-link {
            display:inline-flex; align-items:center; gap:8px; padding:8px 16px;
            border-radius:20px; font-size:0.76rem; font-weight:700; text-decoration:none;
            border:1px solid rgba(45,217,232,0.3); color:var(--dash-teal);
            background:var(--dash-teal-dim); transition:all 160ms;
        }
        .btn-link:hover { background:rgba(45,217,232,0.22); }

        .muted { font-size:0.82rem; color:var(--dash-text-faint); line-height:1.6; }
        .animate-rise { opacity:0; animation:panelRise 0.55s var(--ease) forwards; }
        @keyframes panelRise { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
        .delay-1 { animation-delay:0.05s } .delay-2 { animation-delay:0.1s } .delay-3 { animation-delay:0.15s }
    </style>
</head>
<body data-page="profile">
    <div id="layout-slot"></div>
    <script src="/static/layout.js"></script>

    <main class="main-content">
        <div class="page-hero animate-rise">
            <div class="page-hero-eyebrow"><i class="fa-solid fa-ghost"></i> Your Legend</div>
            <h1>Profile</h1>
            <p class="page-hero-sub">Your character, stats, and equipped gear at a glance.</p>
        </div>

        <section class="card animate-rise delay-1" id="identity-card">
            <div class="profile-top">
                <div class="avatar-wrap" id="avatar-wrap"><div class="avatar-fallback"><i class="fa-solid fa-user-ghost"></i></div></div>
                <div class="identity">
                    <h2 id="p-username">Loading…</h2>
                    <div class="identity-tags" id="p-tags"></div>
                </div>
            </div>
            <div class="xp-block" id="xp-block" style="display:none">
                <div class="xp-label"><span>Experience</span><span id="xp-text"></span></div>
                <div class="xp-bar"><div class="xp-fill" id="xp-fill"></div></div>
            </div>
        </section>

        <div class="grid-2 animate-rise delay-2" style="margin-top:1.25rem">
            <section class="card">
                <div class="card-title"><i class="fa-solid fa-chart-simple"></i> Stats</div>
                <div class="stat-grid" id="stat-grid"></div>
            </section>
            <section class="card">
                <div class="card-title"><i class="fa-solid fa-gem"></i> Collection</div>
                <div id="rarity-breakdown"><div class="muted">Loading…</div></div>
            </section>
        </div>

        <section class="card animate-rise delay-3">
            <div class="card-title"><i class="fa-solid fa-shield-halved"></i> Equipped Gear</div>
            <div class="equip-grid" id="equip-grid"><div class="muted">Loading…</div></div>
            <div class="cta-row">
                <a class="btn-link" href="/inventory"><i class="fa-solid fa-sack-dollar"></i> Open Inventory</a>
            </div>
        </section>
    </main>

<script>
function escapeHTML(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

const RARITY_COLOR = { common:'var(--rarity-common)', rare:'var(--rarity-rare)', epic:'var(--rarity-epic)', legendary:'var(--rarity-legendary)' };
const fmt = n => Number(n).toLocaleString();

function getIcon(name) {
    const n = (name || '').toLowerCase();
    if (n.includes('sword') || n.includes('blade') || n.includes('dagger')) return 'fa-khanda';
    if (n.includes('shield') || n.includes('armor') || n.includes('plate')) return 'fa-shield-halved';
    if (n.includes('potion') || n.includes('elixir') || n.includes('brew')) return 'fa-flask';
    if (n.includes('gem') || n.includes('crystal') || n.includes('stone')) return 'fa-gem';
    if (n.includes('bow') || n.includes('arrow')) return 'fa-bow-arrow';
    if (n.includes('staff') || n.includes('wand') || n.includes('rod')) return 'fa-wand-magic-sparkles';
    if (n.includes('helmet') || n.includes('helm')) return 'fa-helmet-safety';
    if (n.includes('ring') || n.includes('amulet') || n.includes('necklace')) return 'fa-ring';
    if (n.includes('scroll') || n.includes('tome') || n.includes('book')) return 'fa-scroll';
    if (n.includes('key')) return 'fa-key';
    return 'fa-box';
}

function renderIdentity(me) {
    const name = me.username || 'Adventurer';
    document.getElementById('p-username').textContent = name;
    const sbName = document.getElementById('sidebar-username');
    const sbAvatar = document.getElementById('sidebar-avatar');
    if (sbName && me.username) sbName.textContent = me.username;
    if (sbAvatar && me.avatar) sbAvatar.src = me.avatar;

    if (me.avatar) {
        const img = new Image();
        img.alt = name + ' avatar';
        img.onload = () => { document.getElementById('avatar-wrap').replaceChildren(img); };
        img.src = me.avatar;
    }

    const tags = [];
    if (me.level != null) tags.push(`<span class="tag level"><i class="fa-solid fa-star"></i> Level ${escapeHTML(me.level)}</span>`);
    const cls = me.class || me.character_class;
    if (cls) tags.push(`<span class="tag class"><i class="fa-solid fa-hat-wizard"></i> ${escapeHTML(cls)}</span>`);
    tags.push(`<span class="tag gold"><i class="fa-solid fa-coins"></i> ${fmt(me.gold || 0)} gold</span>`);
    document.getElementById('p-tags').innerHTML = tags.join('');

    const xp = Number(me.xp);
    const next = Number(me.xp_to_next ?? me.next_level_xp ?? me.xp_needed);
    if (Number.isFinite(xp) && Number.isFinite(next) && next > 0) {
        document.getElementById('xp-block').style.display = '';
        document.getElementById('xp-text').textContent = `${fmt(xp)} / ${fmt(next)} XP`;
        requestAnimationFrame(() => {
            document.getElementById('xp-fill').style.width = Math.min(100, (xp / next) * 100) + '%';
        });
    }
}

// Merge /api/me and /api/battle-stats into one stats grid so actions
// performed from the dashboard (hunt / daily / heal) are reflected here.
function renderStats(me, battle, items) {
    const stats = [];
    const push = (label, icon, value, cls) => {
        if (value === undefined || value === null) return;
        stats.push({ label, icon, value: typeof value === 'number' ? fmt(value) : String(value), cls });
    };

    push('Gold', 'fa-coins', me.gold || 0, 'gold');
    push('Level', 'fa-star', me.level);

    // HP / MP (populated by heal / combat actions)
    if (me.hp != null) {
        const maxHp = me.max_hp != null ? ` / ${fmt(me.max_hp)}` : '';
        push('HP', 'fa-heart', `${fmt(me.hp)}${maxHp}`);
    }
    if (me.mp != null) {
        const maxMp = me.max_mp != null ? ` / ${fmt(me.max_mp)}` : '';
        push('MP', 'fa-hat-wizard', `${fmt(me.mp)}${maxMp}`);
    }
    if (me.rank != null) push('Global Rank', 'fa-ranking-star', '#' + me.rank);
    if (me.combat_power != null) push('Combat Power', 'fa-fire', me.combat_power);
    push('Attack', 'fa-khanda', me.attack);
    push('Defense', 'fa-shield-halved', me.defense);

    // Battle stats from /api/battle-stats (wins, losses, xp, boss kills, pvp)
    if (battle) {
        push('Victories', 'fa-trophy', battle.battles_won);
        push('Defeats', 'fa-skull', battle.battles_lost);
        push('Boss Kills', 'fa-dragon', battle.world_boss_kills);
        if (battle.pvp_wins != null || battle.pvp_losses != null) {
            push('PvP Record', 'fa-swords', `${battle.pvp_wins || 0}W / ${battle.pvp_losses || 0}L`);
        }
        push('XP Earned', 'fa-bolt', battle.xp);
    }

    // Fall back to /api/me fields if battle-stats was unavailable
    if (!battle) {
        push('Wins', 'fa-trophy', me.wins);
        push('Kills', 'fa-skull', me.kills);
        push('Streak', 'fa-fire', me.streak);
    }

    const total = items.reduce((s, i) => s + (Number(i.quantity) || 0), 0);
    push('Items Owned', 'fa-box-open', total);
    push('Unique Items', 'fa-layer-group', items.length);

    document.getElementById('stat-grid').innerHTML = stats.map(s => `
        <div class="stat">
            <div class="stat-label"><i class="fa-solid ${s.icon}"></i> ${escapeHTML(s.label)}</div>
            <div class="stat-value ${s.cls || ''}">${escapeHTML(s.value)}</div>
        </div>`).join('');
}

function renderRarity(items) {
    const el = document.getElementById('rarity-breakdown');
    if (!items.length) { el.innerHTML = '<div class="muted">No artifacts yet. Venture out and claim your first.</div>'; return; }
    const counts = { legendary:0, epic:0, rare:0, common:0 };
    items.forEach(i => {
        const r = (i.rarity || 'common').toLowerCase();
        counts[r in counts ? r : 'common'] += Number(i.quantity) || 1;
    });
    const max = Math.max(...Object.values(counts), 1);
    el.innerHTML = Object.entries(counts).map(([r, c]) => `
        <div class="rarity-row">
            <span class="rarity-name" style="color:${RARITY_COLOR[r]}">${r}</span>
            <div class="rarity-track"><div class="rarity-fill" data-w="${(c / max) * 100}" style="background:${RARITY_COLOR[r]}"></div></div>
            <span class="rarity-count">${c}</span>
        </div>`).join('');
    requestAnimationFrame(() => el.querySelectorAll('.rarity-fill').forEach(f => f.style.width = f.dataset.w + '%'));
}

function renderEquipped(items) {
    const el = document.getElementById('equip-grid');
    const equipped = items.filter(i => i.equipped);
    if (!equipped.length) {
        el.innerHTML = '<div class="muted">Nothing equipped. Open your inventory to gear up.</div>';
        return;
    }
    el.innerHTML = equipped.map(i => {
        const r = (i.rarity || 'common').toLowerCase();
        return `
        <div class="equip-item ${escapeHTML(r)}">
            <i class="fa-solid ${getIcon(i.name)}" style="color:${RARITY_COLOR[r] || RARITY_COLOR.common}"></i>
            <div>
                <div class="equip-name">${escapeHTML(i.name || 'Unknown')}</div>
                <div class="equip-rarity" style="color:${RARITY_COLOR[r] || RARITY_COLOR.common}">${escapeHTML(r)}</div>
            </div>
        </div>`;
    }).join('');
}

async function loadProfileData() {
    try {
        const me = await (await fetch('/api/me')).json();
        if (!me.logged_in) { window.location.href = '/'; return; }

        // The standalone game engine is the single source of truth for game numbers.
        try {
            const g = await (await fetch('/api/game/state', { credentials: 'same-origin' })).json();
            if (g.ok) Object.assign(me, g.state);
        } catch (e) { console.error('game state failed', e); }
        renderIdentity(me);

        // Fetch battle stats (same endpoint battle-log uses) so hunt/daily/heal
        // results — wins, xp, boss kills, pvp — are reflected on the profile.
        let battle = null;
        try {
            const bsRes = await fetch('/api/game/battle-stats', { credentials: 'same-origin' });
            if (bsRes.ok) battle = await bsRes.json();
        } catch (e) { console.error('battle-stats fetch failed', e); }

        let items = [];
        try {
            const invData = await (await fetch('/api/game/inventory', { credentials: 'same-origin' })).json();
            items = invData.items || [];
        } catch (e) { console.error(e); }

        renderStats(me, battle, items);
        renderRarity(items);
        renderEquipped(items);
    } catch (e) {
        console.error(e);
        document.getElementById('p-username').textContent = 'Profile unavailable';
        document.getElementById('stat-grid').innerHTML = '<div class="muted">Could not load your profile. Try again later.</div>';
    }
}

document.addEventListener('DOMContentLoaded', loadProfileData);

document.addEventListener('visibilitychange', () => {
    if (!document.hidden) loadProfileData();
});
</script>
</body>
</html>
