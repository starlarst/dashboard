<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auction House - Realm of Valor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Standalone auction-hall look: wine, brass and parchment (deliberately unlike the dashboard). */
        :root {
            --wine-900: #1a0b10;
            --wine-800: #260f17;
            --wine-700: #36151f;
            --wine-600: #4a1c29;
            --brass: #d4a84b;
            --brass-bright: #f0c96a;
            --brass-dim: #8f7233;
            --parchment: #f3e7cf;
            --parchment-2: #e6d4b0;
            --ink: #2a1a12;
            --ink-soft: #6b5240;
            --cream: #f6ecd8;
            --muted: #b8a58a;
            --good: #6fcf8e;
            --bad: #e0675a;
            --r-common: #8a8f98;
            --r-rare: #4f8fe0;
            --r-epic: #a463e0;
            --r-legendary: #e8a02a;
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--cream);
            background:
                radial-gradient(ellipse 80% 50% at 50% -10%, rgba(212,168,75,0.18), transparent 60%),
                repeating-linear-gradient(90deg, rgba(255,255,255,0.012) 0 2px, transparent 2px 46px),
                linear-gradient(180deg, var(--wine-800), var(--wine-900) 60%);
            background-attachment: fixed;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        a { color: inherit; }
        .wrap { max-width: 1120px; margin: 0 auto; padding: 0 1.25rem 4rem; }

        /* ---- top bar ---- */
        .bar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 1.1rem 0; border-bottom: 1px solid rgba(212,168,75,0.22); flex-wrap: wrap; }
        .back { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--muted); font-size: 0.85rem; font-weight: 500; padding: 8px 14px; border: 1px solid rgba(212,168,75,0.25); border-radius: 999px; transition: color .2s, border-color .2s, background .2s; }
        .back:hover { color: var(--brass-bright); border-color: var(--brass); background: rgba(212,168,75,0.08); }
        .purse { display: inline-flex; align-items: center; gap: 10px; padding: 8px 18px; border-radius: 999px; background: linear-gradient(180deg, #3b2a12, #2a1d0b); border: 1px solid var(--brass-dim); box-shadow: inset 0 1px 0 rgba(255,255,255,0.08); }
        .purse i { color: var(--brass-bright); }
        .purse small { font-size: 0.62rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
        .purse strong { font-family: 'Cinzel', serif; font-size: 1.05rem; color: var(--brass-bright); font-variant-numeric: tabular-nums; }

        /* ---- hero ---- */
        .hero { text-align: center; padding: 3rem 0 2rem; }
        .hero .crest { width: 64px; height: 64px; margin: 0 auto 1rem; display: grid; place-items: center; border-radius: 50%; border: 2px solid var(--brass); color: var(--brass-bright); font-size: 1.6rem; background: radial-gradient(circle, rgba(212,168,75,0.2), transparent 70%); box-shadow: 0 0 40px rgba(212,168,75,0.15); }
        .hero h1 { font-family: 'Cinzel', serif; font-size: clamp(2rem, 5vw, 3.1rem); font-weight: 800; letter-spacing: 3px; text-transform: uppercase; color: var(--parchment); text-shadow: 0 2px 0 rgba(0,0,0,0.5); }
        .hero p { color: var(--muted); margin-top: 0.7rem; font-size: 0.95rem; }
        .rule { display: flex; align-items: center; gap: 14px; justify-content: center; margin: 1.4rem auto 0; max-width: 420px; color: var(--brass); }
        .rule::before, .rule::after { content: ''; height: 1px; flex: 1; background: linear-gradient(90deg, transparent, var(--brass-dim)); }
        .rule::after { background: linear-gradient(270deg, transparent, var(--brass-dim)); }

        /* ---- controls ---- */
        .controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin: 1.5rem 0 1.25rem; }
        .search { position: relative; flex: 1; min-width: 200px; }
        .search i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--brass-dim); font-size: 0.85rem; }
        input[type=text], input[type=number], select {
            font-family: inherit; font-size: 0.9rem; color: var(--cream);
            background: rgba(0,0,0,0.28); border: 1px solid rgba(212,168,75,0.28); border-radius: 10px; padding: 11px 14px; outline: none; transition: border-color .2s, box-shadow .2s;
        }
        input:focus, select:focus { border-color: var(--brass); box-shadow: 0 0 0 3px rgba(212,168,75,0.15); }
        .search input { width: 100%; padding-left: 38px; }
        select option { background: var(--wine-800); }
        .tabs { display: inline-flex; padding: 4px; border-radius: 12px; background: rgba(0,0,0,0.3); border: 1px solid rgba(212,168,75,0.2); }
        .tab { font-family: inherit; font-size: 0.82rem; font-weight: 600; color: var(--muted); background: none; border: none; padding: 8px 14px; border-radius: 9px; cursor: pointer; transition: color .2s, background .2s; }
        .tab:hover { color: var(--cream); }
        .tab.on { background: linear-gradient(180deg, var(--brass-bright), var(--brass)); color: var(--ink); }
        .icon-btn { width: 42px; height: 42px; border-radius: 10px; border: 1px solid rgba(212,168,75,0.28); background: rgba(0,0,0,0.28); color: var(--brass-bright); cursor: pointer; transition: background .2s, transform .2s; }
        .icon-btn:hover { background: rgba(212,168,75,0.12); }
        .icon-btn.spin i { animation: spin .7s linear; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .count { font-size: 0.8rem; color: var(--muted); margin-bottom: 1rem; }
        .count strong { color: var(--brass-bright); }

        /* ---- lots ---- */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.25rem; }
        .lot { position: relative; display: flex; flex-direction: column; border-radius: 6px; overflow: hidden; color: var(--ink);
            background: linear-gradient(180deg, var(--parchment), var(--parchment-2));
            box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset, 0 14px 30px rgba(0,0,0,0.45);
            border-top: 4px solid var(--accent, var(--r-common));
            animation: rise .45s cubic-bezier(.22,1,.36,1) both; transition: transform .25s, box-shadow .25s; }
        .lot:hover { transform: translateY(-4px); box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset, 0 22px 38px rgba(0,0,0,0.55); }
        @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
        .lot.common { --accent: var(--r-common); } .lot.rare { --accent: var(--r-rare); }
        .lot.epic { --accent: var(--r-epic); } .lot.legendary { --accent: var(--r-legendary); }
        .lot-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px 0; font-size: 0.68rem; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; }
        .rar { color: var(--accent); }
        .art { margin: 10px 16px 0; height: 96px; display: grid; place-items: center; font-size: 3rem; border-radius: 4px; background: radial-gradient(circle at 50% 40%, rgba(255,255,255,0.7), rgba(0,0,0,0.06) 75%); border: 1px solid rgba(42,26,18,0.15); }
        .lot-body { padding: 12px 16px 6px; }
        .lot-name { font-family: 'Cinzel', serif; font-size: 1.15rem; font-weight: 700; line-height: 1.25; }
        .lot-sub { margin-top: 4px; font-size: 0.78rem; color: var(--ink-soft); }
        .lot-sub b { color: var(--ink); font-weight: 600; }
        .price-row { display: flex; justify-content: space-between; align-items: flex-end; padding: 10px 16px; margin: 6px 16px 0; border-top: 1px dashed rgba(42,26,18,0.3); border-bottom: 1px dashed rgba(42,26,18,0.3); }
        .price small, .timer small { display: block; font-size: 0.6rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; }
        .price strong { font-family: 'Cinzel', serif; font-size: 1.45rem; color: #7a5410; font-variant-numeric: tabular-nums; }
        .timer { text-align: right; }
        .timer strong { font-size: 0.95rem; font-variant-numeric: tabular-nums; }
        .timer.soon strong { color: #b3321f; }
        .bid-row { display: flex; gap: 8px; padding: 12px 16px 16px; margin-top: auto; }
        .bid-row input { flex: 1; min-width: 0; background: #fffaf0; color: var(--ink); border-color: rgba(42,26,18,0.3); font-weight: 600; }
        .bid-row input:focus { border-color: #7a5410; box-shadow: 0 0 0 3px rgba(122,84,16,0.18); }
        .bid-btn { font-family: 'Cinzel', serif; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; font-size: 0.82rem; padding: 0 20px; border: none; border-radius: 10px; cursor: pointer; color: var(--cream); background: linear-gradient(180deg, #7a1f2f, #561220); box-shadow: 0 3px 0 #33080f, 0 8px 14px rgba(0,0,0,0.3); transition: transform .12s, box-shadow .12s, filter .2s; }
        .bid-btn:hover { filter: brightness(1.12); }
        .bid-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #33080f; }
        .bid-btn:disabled { opacity: .55; cursor: wait; }
        .status { margin: 0 16px 16px; margin-top: auto; padding: 11px 14px; border-radius: 8px; font-size: 0.82rem; font-weight: 600; text-align: center; }
        .status.mine { background: rgba(42,26,18,0.08); color: var(--ink-soft); }
        .status.top { background: rgba(47,133,80,0.15); color: #1f6b3e; }
        .status.ended { background: rgba(179,50,31,0.12); color: #9a2a19; }
        .lot.dim { filter: saturate(.6); }

        /* ---- empty / loading ---- */
        .empty { grid-column: 1 / -1; text-align: center; padding: 4rem 1rem; color: var(--muted); }
        .empty i { display: block; font-size: 2.2rem; margin-bottom: 1rem; color: var(--brass-dim); }

        /* ---- toast ---- */
        .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 140%); z-index: 50; max-width: min(92vw, 420px); padding: 13px 20px; border-radius: 12px; font-size: 0.9rem; font-weight: 500; background: var(--wine-700); color: var(--cream); border: 1px solid var(--brass); box-shadow: 0 14px 36px rgba(0,0,0,0.55); transition: transform .3s cubic-bezier(.22,1,.36,1); }
        .toast.show { transform: translate(-50%, 0); }
        .toast.err { border-color: var(--bad); }

        @media (max-width: 560px) {
            .hero { padding: 2rem 0 1rem; }
            .grid { grid-template-columns: 1fr; }
            .tabs { width: 100%; } .tab { flex: 1; padding: 9px 4px; }
            input[type=text], input[type=number], select { font-size: 16px; }
        }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="bar">
            <a class="back" href="/"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
            <div class="purse" title="Your gold">
                <i class="fa-solid fa-coins"></i>
                <div><small>Your purse</small><br><strong id="gold">0</strong></div>
            </div>
        </div>

        <header class="hero">
            <div class="crest"><i class="fa-solid fa-gavel"></i></div>
            <h1>The Auction House</h1>
            <p>Name your price. Highest bid when the hammer falls takes the lot.</p>
            <div class="rule"><i class="fa-solid fa-diamond"></i></div>
        </header>

        <div class="controls">
            <div class="search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="q" placeholder="Search lots or sellers" aria-label="Search lots or sellers" autocomplete="off">
            </div>
            <div class="tabs" role="tablist" aria-label="Filter lots">
                <button class="tab on" data-view="all" role="tab">All lots</button>
                <button class="tab" data-view="bids" role="tab">My bids</button>
                <button class="tab" data-view="mine" role="tab">My listings</button>
            </div>
            <select id="sort" aria-label="Sort lots">
                <option value="end">Ending soonest</option>
                <option value="low">Price: low to high</option>
                <option value="high">Price: high to low</option>
            </select>
            <button class="icon-btn" id="refresh" aria-label="Refresh"><i class="fa-solid fa-rotate"></i></button>
        </div>

        <div class="count" id="count"></div>
        <div class="grid" id="grid">
            <div class="empty"><i class="fa-solid fa-spinner fa-spin"></i>Opening the hall...</div>
        </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
    (function () {
        let lots = [];          // each lot gets .endsAt (ms) so countdowns tick locally
        let me = null, gold = 0, busy = false, view = 'all', toastTimer = null;

        const $ = id => document.getElementById(id);
        const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const num = n => (Number(n) || 0).toLocaleString();
        const isMine = a => me && String(a.seller) === String(me.discord_id);
        const isTop  = a => me && a.top_bidder && String(a.top_bidder) === String(me.discord_id);
        const secsLeft = a => Math.max(0, Math.floor((a.endsAt - Date.now()) / 1000));
        const minBid = a => (Number(a.current_bid) || 0) + 1;

        function toast(msg, isError) {
            const t = $('toast');
            t.textContent = msg;
            t.classList.toggle('err', !!isError);
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
        }

        function fmtLeft(s) {
            if (s <= 0) return 'Ended';
            const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
            if (d) return d + 'd ' + h + 'h';
            if (h) return h + 'h ' + m + 'm';
            return m + 'm ' + String(sec).padStart(2, '0') + 's';
        }

        function visible() {
            const q = $('q').value.trim().toLowerCase();
            let list = lots.filter(a => {
                if (view === 'bids' && !isTop(a)) return false;
                if (view === 'mine' && !isMine(a)) return false;
                return !q || (a.name || '').toLowerCase().includes(q) ||
                       (a.seller_name || '').toLowerCase().includes(q) || String(a.seller || '').includes(q);
            });
            const sort = $('sort').value;
            list.sort((x, y) =>
                sort === 'low'  ? (x.current_bid - y.current_bid) :
                sort === 'high' ? (y.current_bid - x.current_bid) :
                (x.endsAt - y.endsAt));
            return list;
        }

        function render() {
            const list = visible();
            const grid = $('grid');
            $('count').innerHTML = '<strong>' + list.length + '</strong> ' + (list.length === 1 ? 'lot' : 'lots') + ' on the block';

            if (!list.length) {
                const msg = view === 'bids' ? "You're not the highest bidder on any lot." :
                            view === 'mine' ? "You have no active listings." : 'No lots match your search.';
                grid.innerHTML = '<div class="empty"><i class="fa-solid fa-gavel"></i>' + msg + '</div>';
                return;
            }

            grid.innerHTML = '';
            list.forEach((a, i) => {
                const rar = ['common', 'rare', 'epic', 'legendary'].includes((a.rarity || '').toLowerCase()) ? a.rarity.toLowerCase() : 'common';
                const mine = isMine(a), top = isTop(a);
                const left = secsLeft(a), ended = left <= 0;
                const min = minBid(a);

                const action = mine ? '<div class="status mine"><i class="fa-solid fa-store"></i> Your listing</div>'
                    : top ? '<div class="status top"><i class="fa-solid fa-crown"></i> You hold the highest bid</div>'
                    : ended ? '<div class="status ended">Bidding has closed</div>'
                    : '<div class="bid-row"><input type="number" min="' + min + '" step="1" value="' + min + '" aria-label="Your bid in gold"><button class="bid-btn" type="button">Bid</button></div>';

                const el = document.createElement('article');
                el.className = 'lot ' + rar + (ended ? ' dim' : '');
                el.style.animationDelay = Math.min(i, 12) * 40 + 'ms';
                el.innerHTML =
                    '<div class="lot-head"><span>Lot #' + esc(a.id) + '</span><span class="rar">' + esc(rar) + '</span></div>' +
                    '<div class="art" aria-hidden="true">' + esc(a.icon || '⚔️') + '</div>' +
                    '<div class="lot-body"><div class="lot-name">' + esc(a.name) + '</div>' +
                    '<div class="lot-sub">Seller <b>' + esc(a.seller_name || a.seller || 'Unknown') + '</b>' +
                    (a.top_bidder_name ? ' &middot; Leading <b>' + esc(a.top_bidder_name) + '</b>' : ' &middot; No bids yet') + '</div></div>' +
                    '<div class="price-row"><div class="price"><small>Current bid</small><strong>' + num(a.current_bid) + '</strong></div>' +
                    '<div class="timer' + (left > 0 && left < 3600 ? ' soon' : '') + '" data-id="' + esc(a.id) + '"><small>Time left</small><strong>' + fmtLeft(left) + '</strong></div></div>' +
                    action;

                const btn = el.querySelector('.bid-btn');
                if (btn) {
                    const input = el.querySelector('input');
                    const go = () => placeBid(a, parseInt(input.value, 10), btn);
                    btn.addEventListener('click', go);
                    input.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
                }
                grid.appendChild(el);
            });
        }

        // Tick countdowns locally; re-render once if a lot just ended.
        setInterval(() => {
            let justEnded = false;
            document.querySelectorAll('.timer[data-id]').forEach(t => {
                const a = lots.find(x => String(x.id) === t.dataset.id);
                if (!a) return;
                const s = secsLeft(a);
                t.querySelector('strong').textContent = fmtLeft(s);
                t.classList.toggle('soon', s > 0 && s < 3600);
                if (s <= 0 && !t.dataset.done) { t.dataset.done = '1'; justEnded = true; }
            });
            if (justEnded) render();
        }, 1000);

        async function placeBid(a, amount, btn) {
            if (busy) return;
            if (!amount || amount < minBid(a)) return toast('Your bid must be at least ' + num(minBid(a)) + ' gold.', true);
            if (amount > gold) return toast("You don't have enough gold for that bid.", true);
            busy = true; btn.disabled = true;
            try {
                const res = await fetch('/api/auctions/bid', {
                    method: 'POST', credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ auction_id: a.id, amount: amount })
                });
                const d = await res.json().catch(() => ({}));
                if (res.status === 401) { toast('Your session expired. Please sign in again.', true); return; }
                if (!d.ok) { toast(d.error || 'The bid was not accepted.', true); await load(); return; }
                toast('Bid of ' + num(amount) + ' gold placed on ' + a.name + '.');
                if (typeof d.gold === 'number') setGold(d.gold);
                await load();
            } catch (e) {
                console.error(e);
                toast('Could not reach the auction house.', true);
            } finally { busy = false; btn.disabled = false; }
        }

        function setGold(g) { gold = Number(g) || 0; $('gold').textContent = num(gold); }

        async function load() {
            try {
                const res = await fetch('/api/auctions', { credentials: 'same-origin' });
                const d = await res.json();
                const t0 = Date.now();
                lots = (d.auctions || []).map(a => Object.assign({}, a, { endsAt: t0 + (Number(a.time_left) || 0) * 1000 }));
                render();
            } catch (e) {
                console.error(e);
                $('grid').innerHTML = '<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i>The hall is closed right now. Try again shortly.</div>';
            }
        }

        async function loadGold() {
            try {
                const res = await fetch('/api/game/state', { credentials: 'same-origin' });
                const d = await res.json();
                if (d.ok) setGold(d.state.gold);
                else if (me) setGold(me.gold);
            } catch (e) { if (me) setGold(me.gold); }
        }

        async function init() {
            try {
                const res = await fetch('/api/me', { credentials: 'same-origin' });
                const d = await res.json();
                if (!d.logged_in) { window.location.href = '/'; return; }
                me = d;
                setGold(d.gold);
            } catch (e) { window.location.href = '/'; return; }

            $('q').addEventListener('input', render);
            $('sort').addEventListener('change', render);
            document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
                view = t.dataset.view;
                render();
            }));
            $('refresh').addEventListener('click', e => {
                const b = e.currentTarget; b.classList.remove('spin'); void b.offsetWidth; b.classList.add('spin');
                load(); loadGold();
            });
            await Promise.all([load(), loadGold()]);
            setInterval(load, 30000);
        }
        init();
    })();
    </script>
</body>
</html>
