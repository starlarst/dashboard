        // ── photo / video upload ──────────────────────────
        function clearUpload(sent) {
            if (uploadXhr) { try { uploadXhr.abort(); } catch (e) { /* done */ } uploadXhr = null; }
            if (uploadBlobUrl) { URL.revokeObjectURL(uploadBlobUrl); uploadBlobUrl = null; }
            pendingUpload = null;
            $('attachBar').classList.remove('show');
            $('attachThumb').innerHTML = '';
            $('attachProg').classList.remove('done');
            $('attachProg').firstElementChild.style.width = '0';
        }

        function startUpload(f) {
            if (!UPLOAD_TYPES.includes(f.type)) { toast('Use a JPEG, PNG, GIF, WebP, MP4, MOV or WebM file.', true); return; }
            if (f.size > limits.upload_mb * 1024 * 1024) { toast(`Files can be up to ${limits.upload_mb} MB.`, true); return; }
            clearUpload();
            uploadBlobUrl = URL.createObjectURL(f);
            $('attachThumb').innerHTML = f.type.startsWith('video/')
                ? `<video src="${uploadBlobUrl}" muted preload="metadata" aria-hidden="true"></video>`
                : `<img src="${uploadBlobUrl}" alt="">`;
            $('attachName').textContent = f.name;
            $('attachStatus').textContent = `Uploading ${fmtSize(f.size)}…`;
            $('attachBar').classList.add('show');

            const bar = $('attachProg').firstElementChild;
            const xhr = new XMLHttpRequest();
            uploadXhr = xhr;
            xhr.open('POST', '/api/community/upload');
            xhr.withCredentials = true;
            xhr.setRequestHeader('Content-Type', 'application/octet-stream');
            xhr.upload.onprogress = e => {
                if (!e.lengthComputable) return;
                const pct = Math.round(e.loaded / e.total * 100);
                bar.style.width = pct + '%';
                $('attachStatus').textContent = `Uploading ${pct}%`;
            };
            xhr.onload = () => {
                if (uploadXhr !== xhr) return;
                uploadXhr = null;
                if (xhr.status === 401) { window.location.href = '/'; return; }
                let d = {};
                try { d = JSON.parse(xhr.responseText); } catch (e) { /* plain-text error from a proxy */ }
                if (xhr.status >= 200 && xhr.status < 300 && d.ok) {
                    pendingUpload = d.upload;
                    bar.style.width = '100%';
                    $('attachProg').classList.add('done');
                    $('attachStatus').textContent = 'Ready. Press Send.';
                } else {
                    toast(d.error || (xhr.status === 413 ? `Files can be up to ${limits.upload_mb} MB.` : 'Upload failed.'), true);
                    clearUpload();
                }
            };
            xhr.onerror = () => { if (uploadXhr !== xhr) return; uploadXhr = null; toast('Upload failed. Check your connection.', true); clearUpload(); };
            xhr.send(f);                                   // the File itself is the body, so nothing is base64-encoded
        }

        async function uploadEmoji() {
            const f = $('ceFile').files[0];
            const name = $('ceName').value.trim().replace(/^:|:$/g, '').toLowerCase();
            if (!f) { toast('Choose a GIF, PNG or WebP file first.', true); return; }
            if (!/^image\/(gif|png|webp)$/.test(f.type)) { toast('Use a GIF, PNG or WebP image.', true); return; }
            if (f.size > emojiMaxKb * 1024) { toast(`Emoji files can be up to ${emojiMaxKb} KB.`, true); return; }
            if (!/^[a-z0-9_]{2,24}$/.test(name)) { toast('Names use 2 to 24 letters, numbers or underscores.', true); return; }
            const data = await new Promise((res, rej) => {
                const fr = new FileReader();
                fr.onload = () => res(String(fr.result).split(',')[1] || '');
                fr.onerror = () => rej(new Error('read'));
                fr.readAsDataURL(f);

        // ── older messages ────────────────────────────────
        async function loadOlder() {

            el.scrollTop = el.scrollHeight - prevH;                // keep the reader where they were
        }

        // ── search ────────────────────────────────────────
        function openSearch() {
            openModal(`<h2 id="modalTitle">Search ${channel === 'lounge' ? 'the Lounge' : 'this conversation'}</h2>
                <input class="cm-input" id="sq" type="search" placeholder="Type at least 2 letters" aria-label="Search messages">
                <div class="cm-items" id="sr" style="max-height:340px" aria-live="polite"></div>
                <div class="row"><button type="button" class="cm-minibtn" id="sx" style="padding:8px 14px">Close</button></div>`, () => {
                let t = null;
                $('sx').addEventListener('click', closeModal);
                $('sq').addEventListener('input', () => {
                    clearTimeout(t);
                    t = setTimeout(async () => {
                        const q = $('sq').value.trim();
                        if (q.length < 2) { $('sr').innerHTML = ''; return; }
                        const r = await api('GET', `search?channel=${encodeURIComponent(channel)}&q=${encodeURIComponent(q)}`);
                        if (!$('sr')) return;
                        $('sr').innerHTML = !r.ok ? `<p>${esc(r.data.error || 'Search failed.')}</p>`
                            : !r.data.results.length ? '<p>No messages found.</p>'
                            : r.data.results.map(x => `<div class="cm-hrow"><span><b>${esc(x.name)}</b> ${esc(x.body.slice(0, 200))}</span><span>${esc(new Date(x.ts).toLocaleString())}</span></div>`).join('');
                    }, 350);
                });
            });
        }

        // ── report a message ──────────────────────────────
        function openReport(id) {
            const m = findMsg(id); if (!m) return;
            openModal(`<h2 id="modalTitle">Report message</h2>
                <p>From ${esc(m.name)}: ${esc(previewOf(m))}</p>
                <label>Reason (optional)<input class="cm-input" id="rr" maxlength="200" placeholder="Spam, harassment, scam…"></label>
                <p>Moderators will see this message and your report.</p>
                <p class="cm-err" id="re" role="alert"></p>
                <div class="row"><button type="button" class="cm-minibtn" id="rc" style="padding:8px 14px">Cancel</button><button type="button" class="cm-send" id="rs">Send report</button></div>`, () => {
                $('rc').addEventListener('click', closeModal);
                $('rs').addEventListener('click', async () => {
                    $('rs').disabled = true;
                    const r = await api('POST', `messages/${id}/report`, { reason: $('rr').value });
                    if (r.ok) { closeModal(); toast('Report sent. Thank you.'); }
                    else { $('re').textContent = r.data.error || 'Could not send the report.'; $('rs').disabled = false; }
                });
            });
        }

        // ── moderation (admins) ───────────────────────────
        function openMod(key, name, after) {
            openModal(`<h2 id="modalTitle">Moderate ${esc(name)}</h2>
                <label>Action<select class="cm-input" id="mk">
                    <option value="mute">Mute (can read, cannot post)</option>
                    <option value="ban">Ban from the Community</option>
                    <option value="clear">Lift mute or ban</option></select></label>
                <label>Hours (empty = permanent ban)<input class="cm-input" id="mh" type="number" min="1" max="8760" value="24"></label>
                <label>Reason (shown to them)<input class="cm-input" id="mr" maxlength="200"></label>
                <p class="cm-err" id="mer" role="alert"></p>
                <div class="row"><button type="button" class="cm-minibtn" id="mc" style="padding:8px 14px">Cancel</button><button type="button" class="cm-send" id="ms">Apply</button></div>`, () => {
                $('mc').addEventListener('click', closeModal);
                $('ms').addEventListener('click', async () => {
                    $('ms').disabled = true;
                    const r = await api('POST', 'admin/sanction', { key, kind: $('mk').value, hours: Number($('mh').value) || 0, reason: $('mr').value });
                    if (r.ok) { closeModal(); toast('Done.'); if (after) after(); }
                    else { $('mer').textContent = r.data.error || 'Could not apply.'; $('ms').disabled = false; }
                });
            });
        }

        async function openAdmin(tab) {
            tab = tab || 'reports';
            openModal('<h2 id="modalTitle">Moderation</h2><p>Loading…</p>');
            $('modal').style.width = 'min(760px, 100%)';
            const r = await api('GET', tab === 'gifts' ? 'admin/gifts' : tab === 'log' ? 'admin/log' : 'admin/reports');
            if (!r.ok) { closeModal(); toast(r.data.error || 'Could not load.', true); return; }
            const tabs = `<div class="cm-gifttabs" role="tablist">
                <button type="button" role="tab" data-t="reports" aria-selected="${tab === 'reports'}">Reports</button>
                <button type="button" role="tab" data-t="gifts" aria-selected="${tab === 'gifts'}">Gift log</button>
                <button type="button" role="tab" data-t="log" aria-selected="${tab === 'log'}">Audit log</button></div>`;
            const body = tab === 'log'
                ? (r.data.log.map(l => `<div class="cm-hrow"><span><b>${esc(l.admin)}</b> ${esc(l.action.replace(/_/g, ' '))}${l.target ? ' → ' + esc(l.target) : ''}${l.detail ? ' · ' + esc(l.detail) : ''}</span><span>${esc(new Date(l.ts).toLocaleString())}</span></div>`).join('') || '<p>Nothing logged yet.</p>')
                : tab === 'gifts'
                ? (r.data.gifts.map(g => `<div class="cm-hrow"><span>${esc(g.from_name)} → ${esc(g.to_name)}: ${esc(g.item_name ? g.qty + '× ' + g.item_name : (g.amount || 0).toLocaleString() + ' gold')}${g.note ? ' “' + esc(g.note) + '”' : ''}</span><span>${esc(new Date(g.ts).toLocaleString())}</span></div>`).join('') || '<p>No gifts yet.</p>')
                : (r.data.reports.map(x => `<div class="cm-rep" data-rid="${x.id}">
                    <div><b>${esc(x.sender_name)}</b> reported by ${esc(x.reporter_name)} · ${esc(new Date(x.ts).toLocaleString())}${x.dm ? ' · private message' : ''}</div>
                    <div>“${esc(x.snapshot)}”</div>${x.reason ? `<div>Reason: ${esc(x.reason)}</div>` : ''}
                    <div class="row"><button type="button" class="cm-minibtn" data-a="dismiss">Dismiss</button><button type="button" class="cm-minibtn" data-a="delete">Delete message</button><button type="button" class="cm-minibtn" data-a="history">Edit history</button><button type="button" class="cm-minibtn" data-a="mod">Mute / ban</button></div></div>`).join('') || '<p>No open reports.</p>');
            $('modal').innerHTML = `<h2 id="modalTitle">Moderation</h2>${tabs}<div class="cm-items" style="max-height:60vh">${body}</div>
                <div class="row"><button type="button" class="cm-minibtn" id="ax" style="padding:8px 14px">Close</button></div>`;
            $('modal').querySelectorAll('[data-t]').forEach(b => b.addEventListener('click', () => openAdmin(b.dataset.t)));
            $('ax').addEventListener('click', closeModal);
            $('modal').querySelectorAll('.cm-rep').forEach(el => {
                const x = r.data.reports.find(y => y.id === Number(el.dataset.rid));
                const resolve = () => api('POST', `admin/reports/${x.id}/resolve`, {});
                el.querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', async () => {
                    const a = b.dataset.a;
                    if (a === 'mod') { openMod(x.sender_key, x.sender_name, async () => { await resolve(); openAdmin('reports'); }); return; }
                    if (a === 'history') {
                        const h = await api('GET', 'admin/history/' + x.message_id);
                        if (!h.ok) { toast(h.data.error || 'Could not load.', true); return; }
                        $('modal').innerHTML = `<h2 id="modalTitle">Edit history</h2>
                            <div class="cm-items" style="max-height:60vh"><div class="cm-hrow"><span><b>Now:</b> ${esc(h.data.deleted ? '[deleted]' : h.data.current)}</span></div>
                            ${h.data.edits.map(e => `<div class="cm-hrow"><span><b>${esc(e.editor)}:</b> ${esc(e.old_body)}</span><span>${esc(new Date(e.ts).toLocaleString())}</span></div>`).join('')}</div>
                            <div class="row"><button type="button" class="cm-minibtn" id="hb" style="padding:8px 14px">Back</button></div>`;
                        $('hb').addEventListener('click', () => openAdmin('reports'));
                        return;
                    }
                    if (a === 'delete') {
                        const d = await api('DELETE', 'messages/' + x.message_id);
                        if (!d.ok && d.status !== 404) { toast(d.data.error || 'Could not delete.', true); return; }
                    }
                    await resolve();
                    openAdmin('reports');
                }));
            });
        }

        // ── my gift history ───────────────────────────────
        async function openGiftHistory() {
            openModal('<h2 id="modalTitle">Your gifts</h2><p>Loading…</p>');
            const r = await api('GET', 'gift/history');
            if (!r.ok) { closeModal(); toast(r.data.error || 'Could not load.', true); return; }
            const rows = r.data.gifts.map(g => `<div class="cm-hrow"><span>${g.direction === 'sent' ? 'Sent' : 'Received'} <b>${esc(g.item_name ? g.qty + '× ' + g.item_name : (g.amount || 0).toLocaleString() + ' gold')}</b> ${g.direction === 'sent' ? 'to' : 'from'} ${esc(g.other_name)}${g.note ? ' · “' + esc(g.note) + '”' : ''}</span><span>${esc(new Date(g.ts).toLocaleDateString())}</span></div>`).join('') || '<p>No gifts yet.</p>';
            $('modal').innerHTML = `<h2 id="modalTitle">Your gifts</h2><div class="cm-items" style="max-height:60vh">${rows}</div>
                <div class="row"><button type="button" class="cm-minibtn" id="hx" style="padding:8px 14px">Close</button></div>`;
            $('hx').addEventListener('click', closeModal); $('hx').focus();
        }

        // ── notifications + sound ─────────────────────────
        try { soundOn = localStorage.getItem('cm_sound') === '1'; } catch (e) { soundOn = false; }
        const mentionsMe = m => {
            if (!me || m.kind !== 'text') return false;
            try { return new RegExp('(^|[\\s(])@' + me.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![\\p{L}\\p{N}_])', 'iu').test(m.body); } catch (e) { return false; }
        };
        function beep() {
            try {
                const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain();
                o.connect(g); g.connect(a.destination); o.frequency.value = 880;
                g.gain.setValueAtTime(.08, a.currentTime); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + .25);
                o.start(); o.stop(a.currentTime + .26); setTimeout(() => a.close(), 400);
            } catch (e) { /* audio blocked */ }
        }
        function notify(title, body) {
            if (!soundOn || !me || (me.chosen_status || me.status) === 'dnd') return;
            beep();
            if (document.hidden && 'Notification' in window && Notification.permission === 'granted') {
                try { const n = new Notification(title, { body: body || '', tag: 'cm' }); n.onclick = () => { window.focus(); n.close(); }; } catch (e) { /* unsupported */ }
            }
        }
        function initBell() {
            const b = $('bellBtn');
            b.setAttribute('aria-pressed', String(soundOn));
            b.addEventListener('click', async () => {
                soundOn = !soundOn;
                try { localStorage.setItem('cm_sound', soundOn ? '1' : '0'); } catch (e) { /* private mode */ }
                b.setAttribute('aria-pressed', String(soundOn));
                if (soundOn) {
                    if ('Notification' in window && Notification.permission === 'default') { try { await Notification.requestPermission(); } catch (e) { /* ignore */ } }
                    beep(); toast('Sound and notifications on.');
                } else toast('Sound and notifications off.');
            });
        }

        // ── photo lightbox ────────────────────────────────
        function openLightbox(src) {
            const prev = document.activeElement;
            const d = document.createElement('div');
            d.className = 'cm-lb-bg'; d.tabIndex = -1;
            d.setAttribute('role', 'dialog'); d.setAttribute('aria-label', 'Photo viewer. Press Escape to close.');
            d.innerHTML = `<img src="${esc(src)}" alt="Full size photo">`;
            const close = () => { d.remove(); document.removeEventListener('keydown', onKey, true); if (prev && prev.focus) { try { prev.focus(); } catch (e) { /* gone */ } } };
            const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
            d.addEventListener('click', close);
            document.addEventListener('keydown', onKey, true);
            document.body.appendChild(d); d.focus();
        }

        $('searchBtn').addEventListener('click', openSearch);
        $('histBtn').addEventListener('click', openGiftHistory);
        $('adminBtn').addEventListener('click', () => openAdmin('reports'));

        // ── presence + polling ────────────────────────────
        ['mousemove', 'keydown', 'click', 'touchstart', 'scroll'].forEach(ev => window.addEventListener(ev, () => { lastActivity = Date.now(); }, { passive: true }));
        const isActive = () => !document.hidden && Date.now() - lastActivity < 5 * 60 * 1000;

        setInterval(() => api('POST', 'heartbeat', { active: isActive() }), 30000);
        setInterval(() => { if (!document.hidden) pollMessages(false); }, 3000);
        setInterval(() => { if (!document.hidden) loadMembers(); }, 10000);
        setInterval(() => { if (!document.hidden) loadEmojis(); }, 30000);
        setInterval(async () => { const r = await api('GET', 'me'); if (r.ok) { me = r.data.me; renderMe(); } }, 60000);
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) { api('POST', 'heartbeat', { active: true }); pollMessages(false); loadMembers(); }
        });

        // ── boot ──────────────────────────────────────────
        (async function init() {
            const r = await api('GET', 'me');
            if (!r.ok) { $('msgs').innerHTML = `<div class="cm-empty">${esc(r.data.error || 'Could not load the Community. Try again later.')}</div>`; return; }
            me = r.data.me; isAdmin = r.data.is_admin; gifSearch = r.data.gif_search; limits = Object.assign(limits, r.data.limits || {});
            if (Array.isArray(r.data.reactions) && r.data.reactions.length) reactionSet = r.data.reactions;
            if (Array.isArray(r.data.muted_channels)) mutedChannels = r.data.muted_channels;
            renderMe(); renderHead(); $('adminBtn').hidden = !isAdmin; initBell();
            await loadMembers();
            await loadEmojis();
            await openChannel('lounge');
        })();
    })();
    </script>
</body>
</html>
