<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Ghost | Inventory</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700&family=Inter:wght@400;500;600;700" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/dashboard.css">
    <style>:root {
            --void-black:#0a0a0f;
            --dash-bg:#08090d;
            --spectral-teal:#00f3ff;
            --dash-teal:#2dd9e8;
            --dash-teal-dim:rgba(45,217,232,0.13);
            --soul-purple:#bc13fe;
            --dash-purple:   #a855f7;
            --dash-purple-dim:rgba(168,85,247,0.12);
            --bone-white:#f4f4f5;
            --dash-text-dim:#a1a1aa;
            --dash-text-faint:#71717a;
            --glass-bg:rgba(255,255,255,0.04);
            --glass-border:rgba(255,255,255,0.1);
            --gold:#fbbf24;
            --emerald:       #34d399;
            --red:           #f87171;
            --rarity-common:  #9ca3af;
            --rarity-rare:    #3b82f6;
            --rarity-epic:    #a855f7;
            --rarity-legendary:#f59e0b;
            --sidebar-w:     248px;
            --ease:          cubic-bezier(0.22,1,0.36,1);
            --ease-snap:     cubic-bezier(0.4,0,0.2,1);
            --radius-sm:     10px;
            --radius-md:16px;
            --radius-lg:20px;
            --shadow-card:   0 4px 24px rgba(0,0,0,0.35);
        }

        @media (prefers-reduced-motion: reduce) {*, *::before, *::after { animation-duration:0.001ms!important; transition-duration:0.001ms!important; }
        }* { margin:0; padding:0; box-sizing:border-box; }body {
            font-family:'Sora','Plus Jakarta Sans','Inter',sans-serif;
            background:var(--void-black);
            color:var(--bone-white);
            min-height:100vh;
            
            overflow-x:hidden;
        }body::before {
            content:'';
            position:fixed; inset:0;
            background:
                radial-gradient(ellipse at 15% 40%, rgba(45,217,232,0.04) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 60%, rgba(188,19,254,0.03) 0%, transparent 55%);
            pointer-events:none; z-index:0;
        }

        @keyframes ghostFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }.page-hero { margin-bottom:2rem; padding-bottom:1.75rem; border-bottom:1px solid var(--glass-border); }.page-hero-eyebrow {
            font-size:0.72rem; font-weight:700; letter-spacing:2px; text-transform:uppercase;
            color:var(--dash-teal); margin-bottom:0.5rem;
            display:flex; align-items:center; gap:8px;
        }.page-hero-eyebrow::before {
            content:''; display:inline-block; width:20px; height:1px;
            background:var(--dash-teal); opacity:0.6;
        }.page-hero h1 {
            font-family:'Sora',sans-serif; font-size:2rem; font-weight:800; letter-spacing:-0.5px;
            background:linear-gradient(135deg,#fff 0%,var(--dash-teal) 100%);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
        }.page-hero-sub { font-size:0.9rem; color:var(--dash-text-dim); margin-top:0.4rem; }.inv-controls {
            display:flex; align-items:center; justify-content:space-between;
            gap:1rem; margin-bottom:1.5rem; flex-wrap:wrap;
        }.filter-pills { display:flex; gap:6px; flex-wrap:wrap; }.filter-pill {
            padding:5px 14px; border-radius:20px; font-size:0.72rem; font-weight:600;
            letter-spacing:0.5px; cursor:pointer; border:1px solid var(--glass-border);
            color:var(--dash-text-dim); background:transparent; transition:all 160ms;
        }.filter-pill:hover, .filter-pill.active {
            background:var(--dash-teal-dim); border-color:rgba(45,217,232,0.3); color:var(--dash-teal);
        }.filter-pill.rarity-common.active { background:rgba(156,163,175,0.12); border-color:rgba(156,163,175,0.3); color:var(--rarity-common); }.filter-pill.rarity-rare.active { background:rgba(59,130,246,0.12);  border-color:rgba(59,130,246,0.3);  color:var(--rarity-rare); }.filter-pill.rarity-epic.active { background:rgba(168,85,247,0.12);  border-color:rgba(168,85,247,0.3);  color:var(--rarity-epic); }.filter-pill.rarity-legendary.active { background:rgba(245,158,11,0.12); border-color:rgba(245,158,11,0.3); color:var(--rarity-legendary); }.currency-strip {
            display:flex; align-items:center; gap:0.75rem;
        }.currency-badge {
            background:var(--glass-bg); border:1px solid var(--glass-border);
            padding:7px 14px; border-radius:20px;
            display:inline-flex; align-items:center; gap:7px;
            font-weight:700; font-size:0.9rem; color:var(--gold);
        }.inv-toolbar {
            display:flex; align-items:center; gap:10px; flex-wrap:wrap;
        }.inv-select {
            background:var(--glass-bg); border:1px solid var(--glass-border);
            color:var(--dash-text-dim); font-size:0.78rem; font-weight:600;
            padding:7px 12px; border-radius:var(--radius-sm);
            font-family:'Sora','Plus Jakarta Sans','Inter',sans-serif; cursor:pointer; outline:none;
            transition:border-color 160ms;
        }.inv-select:hover, .inv-select:focus { border-color:var(--dash-teal); color:var(--bone-white); }.bulk-toggle-btn {
            padding:7px 14px; border-radius:20px; font-size:0.72rem; font-weight:600;
            letter-spacing:0.5px; cursor:pointer; border:1px solid var(--glass-border);
            color:var(--dash-text-dim); background:transparent; transition:all 160ms;
            display:inline-flex; align-items:center; gap:6px;
        }.bulk-toggle-btn:hover { border-color:var(--dash-purple); color:var(--dash-purple); }.bulk-toggle-btn.active { background:var(--dash-purple-dim); border-color:rgba(168,85,247,0.4); color:var(--dash-purple); }.bulk-sell-bar {
            display:none; align-items:center; justify-content:space-between;
            gap:1rem; margin-bottom:1rem; padding:0.85rem 1.25rem;
            background:rgba(248,113,113,0.06); border:1px solid rgba(248,113,113,0.25);
            border-radius:var(--radius-md); flex-wrap:wrap;
        }.bulk-sell-bar.visible { display:flex; }.bulk-sell-info { font-size:0.82rem; color:var(--dash-text-dim); }.bulk-sell-info strong { color:var(--bone-white); }.bulk-sell-actions { display:flex; gap:8px; }.bulk-btn {
            padding:7px 16px; border-radius:var(--radius-sm); font-size:0.76rem; font-weight:700;
            cursor:pointer; border:1px solid var(--glass-border); background:transparent;
            color:var(--dash-text-dim); transition:all 160ms;
        }.bulk-btn.sell { border-color:rgba(248,113,113,0.4); color:var(--red); }.bulk-btn.sell:hover { background:rgba(248,113,113,0.12); }.bulk-btn.cancel:hover { color:var(--bone-white); border-color:var(--dash-text-dim); }.inv-slot.selectable { cursor:pointer; }.inv-slot.selected {
            border-color:var(--dash-purple) !important;
            box-shadow:0 0 0 2px rgba(168,85,247,0.4), 0 8px 24px rgba(168,85,247,0.2) !important;
        }.inv-slot-check {
            position:absolute; top:6px; left:6px; width:18px; height:18px;
            border-radius:5px; border:1.5px solid rgba(255,255,255,0.25);
            background:rgba(0,0,0,0.4); display:none;
            align-items:center; justify-content:center; font-size:0.62rem;
            color:transparent; z-index:2;
        }.bulk-mode .inv-slot-check { display:flex; }.inv-slot.selected .inv-slot-check {
            background:var(--dash-purple); border-color:var(--dash-purple); color:#fff;
        }.inv-grid {
            display:grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap:0.875rem;
        }.inv-slot {
            aspect-ratio:1;
            background:rgba(8,9,13,0.8);
            border:1px solid var(--glass-border);
            border-radius:var(--radius-md);
            display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            position:relative; cursor:pointer;
            transition:all 200ms var(--ease);
            overflow:hidden;
            animation:slotRise 0.4s var(--ease) both;
        }

        @keyframes slotRise { from{opacity:0;transform:scale(0.9)} to{opacity:1;transform:scale(1)} }.inv-slot::before {
            content:'';
            position:absolute; inset:0;
            background:radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.04) 0%, transparent 60%);
            pointer-events:none;
        }.inv-slot.common { border-color: rgba(156,163,175,0.25); }.inv-slot.rare { border-color: rgba(59,130,246,0.35); box-shadow: 0 0 12px rgba(59,130,246,0.08); }.inv-slot.epic { border-color: rgba(168,85,247,0.45); box-shadow: 0 0 16px rgba(168,85,247,0.12); }.inv-slot.legendary {
            border-color: rgba(245,158,11,0.5);
            box-shadow: 0 0 20px rgba(245,158,11,0.15), 0 0 40px rgba(245,158,11,0.05);
            animation: slotRise 0.4s var(--ease) both, legendaryPulse 3s ease-in-out infinite 0.5s;
        }

        @keyframes legendaryPulse {
            0%,100% { box-shadow:0 0 20px rgba(245,158,11,0.15), 0 0 40px rgba(245,158,11,0.05); }
            50%     { box-shadow:0 0 30px rgba(245,158,11,0.3),  0 0 60px rgba(245,158,11,0.12); }
        }.inv-slot:hover {
            transform:translateY(-4px) scale(1.03);
            z-index: 2;
        }.inv-slot.common:hover { border-color:var(--rarity-common); box-shadow:0 8px 24px rgba(0,0,0,0.4); }.inv-slot.rare:hover { border-color:var(--rarity-rare);   box-shadow:0 8px 24px rgba(59,130,246,0.2); }.inv-slot.epic:hover { border-color:var(--rarity-epic);   box-shadow:0 8px 24px rgba(168,85,247,0.25); }.inv-slot.legendary:hover { border-color:var(--rarity-legendary); box-shadow:0 8px 32px rgba(245,158,11,0.3); }.item-icon {
            font-size:1.75rem; margin-bottom:0.4rem;
            transition:transform 200ms var(--ease);
        }.inv-slot:hover .item-icon { transform:scale(1.15); }.item-name {
            font-size:0.65rem; font-weight:600; text-align:center;
            padding:0 6px; line-height:1.3;
            color:var(--dash-text-dim);
            max-width:100%;
            display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
            overflow:hidden;
        }.item-qty {
            position:absolute; bottom:5px; right:7px;
            font-size:0.72rem; font-weight:700;
            background:rgba(0,0,0,0.7); color:var(--bone-white);
            padding:1px 6px; border-radius:4px;
        }.rarity-corner {
            position:absolute; top:0; right:0;
            width:0; height:0;
            border-style:solid; border-width:0 20px 20px 0;
        }.inv-slot.rare .rarity-corner { border-color:transparent var(--rarity-rare) transparent transparent; }.inv-slot.epic .rarity-corner { border-color:transparent var(--rarity-epic) transparent transparent; }.inv-slot.legendary .rarity-corner { border-color:transparent var(--rarity-legendary) transparent transparent; }.item-tooltip {
            position:fixed; z-index:999;
            background:rgba(8,9,13,0.97);
            border:1px solid var(--glass-border);
            border-radius:var(--radius-md);
            padding:1rem 1.25rem;
            min-width:200px;
            pointer-events:none;
            opacity:0;
            transition:opacity 120ms;
            box-shadow:0 16px 48px rgba(0,0,0,0.6);
        }.item-tooltip.visible { opacity:1; }.tooltip-name {
            font-family:'Sora',sans-serif; font-size:0.82rem; font-weight:700;
            margin-bottom:0.4rem;
        }.tooltip-rarity {
            font-size:0.7rem; font-weight:700; letter-spacing:1px; text-transform:uppercase;
            margin-bottom:0.5rem;
        }.tooltip-rarity.common { color:var(--rarity-common); }.tooltip-rarity.rare { color:var(--rarity-rare); }.tooltip-rarity.epic { color:var(--rarity-epic); }.tooltip-rarity.legendary { color:var(--rarity-legendary); }.tooltip-desc { font-size:0.78rem; color:var(--dash-text-dim); line-height:1.5; }.tooltip-badge {
            display:inline-block; font-size:0.62rem; font-weight:700; letter-spacing:0.5px;
            text-transform:uppercase; padding:2px 8px; border-radius:10px;
            background:rgba(52,211,153,0.15); color:var(--emerald); margin-bottom:0.5rem;
        }.empty-state {
            grid-column:1/-1; display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            padding:5rem 2rem; text-align:center; gap:1rem;
        }.empty-icon {
            width:72px; height:72px; border-radius:20px;
            background:rgba(45,217,232,0.06); border:1px solid rgba(45,217,232,0.12);
            display:flex; align-items:center; justify-content:center;
            font-size:1.75rem; color:var(--dash-text-faint);
        }.empty-title {
            font-family:'Sora',sans-serif; font-size:0.9rem; font-weight:700;
            color:var(--dash-text-dim); letter-spacing:0.5px;
        }.empty-sub { font-size:0.82rem; color:var(--dash-text-faint); max-width:280px; line-height:1.6; }.animate-rise { opacity:0; animation:panelRise 0.55s var(--ease) forwards; }
        @keyframes panelRise { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }.delay-1 {animation-delay:0.05s}.delay-2 {animation-delay:0.1s}.delay-3 {animation-delay:0.15s}
    </style>
</head>
<body data-page="inventory">
    <div id="layout-slot"></div>
    <script src="/static/layout.js"></script>
        
    
    <main class="main-content">
        <div class="page-hero animate-rise">
            <div class="page-hero-eyebrow"><i class="fa-solid fa-sack-dollar"></i> Equipment & Loot</div>
            <h1>Inventory</h1>
            <p class="page-hero-sub">Your collection of weapons, armor, potions, and rare artifacts.</p>
        </div>

        <div class="inv-controls animate-rise delay-1">
            <div class="filter-pills">
                <button class="filter-pill active" onclick="filterInv('all',this)">All Items</button>
                <button class="filter-pill rarity-common"    onclick="filterInv('common',this)">Common</button>
                <button class="filter-pill rarity-rare"      onclick="filterInv('rare',this)">Rare</button>
                <button class="filter-pill rarity-epic"      onclick="filterInv('epic',this)">Epic</button>
                <button class="filter-pill rarity-legendary" onclick="filterInv('legendary',this)">Legendary</button>
            </div>
            <div class="inv-toolbar">
                <select class="inv-select" id="sortSelect" onchange="applySort(this.value)">
                    <option value="rarity">Sort: Rarity</option>
                    <option value="name">Sort: Name (A–Z)</option>
                    <option value="qty">Sort: Quantity</option>
                </select>
                <button class="bulk-toggle-btn" id="bulkToggleBtn" onclick="toggleBulkMode()">
                    <i class="fa-solid fa-list-check"></i> Select
                </button>
                <div class="currency-strip">
                    <div class="currency-badge">
                        <i class="fa-solid fa-coins"></i>
                        <span id="gold-display">—</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="bulk-sell-bar" id="bulkSellBar">
            <div class="bulk-sell-info"><strong id="bulkSelCount">0</strong> item(s) selected</div>
            <div class="bulk-sell-actions">
                <button class="bulk-btn cancel" onclick="clearSelection()">Clear</button>
                <button class="bulk-btn sell" onclick="sellSelected()"><i class="fa-solid fa-coins"></i> Sell Selected</button>
            </div>
        </div>

        <div class="inv-grid animate-rise delay-2" id="inventory-container">
            <div class="empty-state">
                <div class="empty-icon"><i class="fa-solid fa-spinner fa-spin"></i></div>
                <div class="empty-title">Loading Artifacts...</div>
                <div class="empty-sub">Reaching into the spectral vault.</div>
            </div>
        </div>
    </main>

    <!-- Tooltip -->
    <div class="item-tooltip" id="item-tooltip">
        <div class="tooltip-name" id="tt-name"></div>
        <div class="tooltip-rarity" id="tt-rarity"></div>
        <div class="tooltip-desc" id="tt-desc"></div>
    </div>

<script>
let allItems = [];
let currentFilter = 'all';
let currentSort = 'rarity';
let bulkMode = false;
let selectedIndices = new Set();
const tooltip = document.getElementById('item-tooltip');

function escapeHTML(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
}

const RARITY_ORDER = { legendary: 0, epic: 1, rare: 2, common: 3 };

function sortItems(items, sortBy) {
    const copy = [...items];
    if (sortBy === 'name') {
        copy.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
    } else if (sortBy === 'qty') {
        copy.sort((a, b) => (Number(b.quantity) || 0) - (Number(a.quantity) || 0));
    } else {
        copy.sort((a, b) => {
            const ra = RARITY_ORDER[(a.rarity || 'common').toLowerCase()] ?? 3;
            const rb = RARITY_ORDER[(b.rarity || 'common').toLowerCase()] ?? 3;
            return ra - rb;
        });
    }
    return copy;
}

function applySort(sortBy) {
    currentSort = sortBy;
    renderCurrentView();
}

function renderCurrentView() {
    let items = currentFilter === 'all'
        ? allItems
        : allItems.filter(i => (i.rarity || 'common').toLowerCase() === currentFilter);
    renderItems(sortItems(items, currentSort));
}

function toggleBulkMode() {
    bulkMode = !bulkMode;
    selectedIndices.clear();
    document.getElementById('inventory-container').classList.toggle('bulk-mode', bulkMode);
    document.getElementById('bulkToggleBtn').classList.toggle('active', bulkMode);
    document.getElementById('bulkSellBar').classList.toggle('visible', bulkMode);
    updateBulkSellBar();
    renderCurrentView();
}

function clearSelection() {
    selectedIndices.clear();
    renderCurrentView();
    updateBulkSellBar();
}

function updateBulkSellBar() {
    document.getElementById('bulkSelCount').textContent = selectedIndices.size;
}

function sellSelected() {
    if (selectedIndices.size === 0) return;
    const count = selectedIndices.size;
    if (!confirm(`Sell ${count} selected item(s)? This cannot be undone.`)) return;

    const originalIndexed = allItems.map((item, i) => ({ item, i }));
    allItems = originalIndexed.filter(({ i }) => !selectedIndices.has(i)).map(({ item }) => item);
    selectedIndices.clear();
    updateBulkSellBar();
    renderCurrentView();
}

document.addEventListener('DOMContentLoaded', async () => {
    try {
        const meRes = await fetch('/api/me');
        const me = await meRes.json();
        if (!me.logged_in) return window.location.href = '/';

        if (me.username) document.getElementById('sidebar-username').textContent = me.username;
        if (me.avatar)   document.getElementById('sidebar-avatar').src = me.avatar;
        document.getElementById('gold-display').textContent = (me.gold || 0).toLocaleString();

        const invRes = await fetch(`/api/inventory/${me.discord_id}`);
        const invData = await invRes.json();
        allItems = invData.items || [];
        renderCurrentView();

    } catch (e) {
        console.error(e);
        document.getElementById('inventory-container').innerHTML = `
            <div class="empty-state">
                <div class="empty-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
                <div class="empty-title">Vault Unreachable</div>
                <div class="empty-sub">Could not access your inventory. Try again later.</div>
            </div>`;
    }
});

function renderItems(items) {
    const container = document.getElementById('inventory-container');
    if (!items || items.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon"><i class="fa-solid fa-box-open"></i></div>
                <div class="empty-title">The Vault is Empty</div>
                <div class="empty-sub">Venture out and claim your first artifact. Monsters await in the Discord realm.</div>
            </div>`;
        return;
    }

    container.innerHTML = '';
    items.forEach((item, idx) => {
        const stableIdx = allItems.indexOf(item);
        const rarity = (item.rarity || 'common').toLowerCase();
        const icon = getIcon(item.name || '');
        const rarityColor = { common:'var(--rarity-common)', rare:'var(--rarity-rare)', epic:'var(--rarity-epic)', legendary:'var(--rarity-legendary)' };
        const safeName = escapeHTML(item.name || 'Unknown');
        const qty = Number(item.quantity) || 0;
        const isSelected = selectedIndices.has(stableIdx);

        const el = document.createElement('div');
        el.className = `inv-slot ${rarity} ${bulkMode ? 'selectable' : ''} ${isSelected ? 'selected' : ''}`;
        el.style.animationDelay = `${idx * 0.02}s`;
        el.dataset.label = safeName;
        el.innerHTML = `
            <div class="rarity-corner"></div>
            <div class="inv-slot-check"><i class="fa-solid fa-check"></i></div>
            <i class="fa-solid ${icon} item-icon" style="color:${rarityColor[rarity]||rarityColor.common}"></i>
            <div class="item-name">${safeName}</div>
            ${qty > 1 ? `<span class="item-qty">×${qty}</span>` : ''}
        `;

        // Unified click: bulk-select OR touch tooltip
        el.addEventListener('click', (e) => {
            if (bulkMode) {
                if (selectedIndices.has(stableIdx)) selectedIndices.delete(stableIdx);
                else selectedIndices.add(stableIdx);
                updateBulkSellBar();
                renderCurrentView();
                return;
            }
            if (window.matchMedia('(hover: none)').matches) {
                e.stopPropagation();
                showTooltipAt(el.getBoundingClientRect(), item, rarity);
            }
        });

        // Desktop hover tooltip only
        el.addEventListener('mousemove', (e) => {
            if (window.matchMedia('(hover: none)').matches) return;
            showTooltip(e, item, rarity);
        });
        el.addEventListener('mouseleave', hideTooltip);

        container.appendChild(el);
    });
}

function filterInv(rarity, btn) {
    document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = rarity;
    renderCurrentView();
}

function showTooltip(e, item, rarity) {
    document.getElementById('tt-name').textContent = item.name || 'Unknown';
    const ttRarity = document.getElementById('tt-rarity');
    ttRarity.textContent = rarity.charAt(0).toUpperCase() + rarity.slice(1);
    ttRarity.className = `tooltip-rarity ${rarity}`;
    const badge = item.equipped ? `<div class="tooltip-badge"><i class="fa-solid fa-check"></i> Equipped</div>` : '';
    document.getElementById('tt-desc').innerHTML = badge + escapeHTML(item.description || `A ${rarity} item of unknown power.`);

    tooltip.style.left = (e.clientX + 16) + 'px';
    tooltip.style.top  = Math.max(8, e.clientY - 60) + 'px';
    tooltip.classList.add('visible');
}

function showTooltipAt(rect, item, rarity) {
    document.getElementById('tt-name').textContent = item.name || 'Unknown';
    const ttRarity = document.getElementById('tt-rarity');
    ttRarity.textContent = rarity.charAt(0).toUpperCase() + rarity.slice(1);
    ttRarity.className = `tooltip-rarity ${rarity}`;
    const badge = item.equipped ? `<div class="tooltip-badge"><i class="fa-solid fa-check"></i> Equipped</div>` : '';
    document.getElementById('tt-desc').innerHTML = badge + escapeHTML(item.description || `A ${rarity} item of unknown power.`);

    const top = Math.max(8, rect.top - 120);
    const left = Math.min(Math.max(8, rect.left), window.innerWidth - 220);
    tooltip.style.left = left + 'px';
    tooltip.style.top  = top + 'px';
    tooltip.classList.add('visible');
}

function hideTooltip() { tooltip.classList.remove('visible'); }

// Dismiss tooltip on any outside tap
document.addEventListener('click', (e) => {
    if (!tooltip.contains(e.target)) hideTooltip();
});

function getIcon(name) {
    const n = name.toLowerCase();
    if (n.includes('sword') || n.includes('blade') || n.includes('dagger')) return 'fa-khanda';
    if (n.includes('shield') || n.includes('armor') || n.includes('plate')) return 'fa-shield-halved';
    if (n.includes('potion') || n.includes('elixir') || n.includes('brew')) return 'fa-flask';
    if (n.includes('gem') || n.includes('crystal') || n.includes('stone')) return 'fa-gem';
    if (n.includes('bow') || n.includes('arrow')) return 'fa-bow-arrow';
    if (n.includes('staff') || n.includes('wand') || n.includes('rod')) return 'fa-wand-magic-sparkles';
    if (n.includes('helmet') || n.includes('helm')) return 'fa-helmet-safety';
    if (n.includes('ring') || n.includes('amulet') || n.includes('necklace')) return 'fa-ring';
    if (n.includes('scroll') || n.includes('tome') || n.includes('book')) return 'fa-scroll';
    if (n.includes('gold') || n.includes('coin')) return 'fa-coins';
    if (n.includes('key')) return 'fa-key';
    return 'fa-box';
}
